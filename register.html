<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | EcoTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                🌱 Eco<span>Track</span>
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join EcoTrack and help build a cleaner community.
            </p>

            <form id="registerForm">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="mobile">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="role">Account Type</label>

                <select id="role" required>
                    <option value="">Select account type</option>
                    <option value="citizen">Citizen</option>
                    <option value="admin">Admin</option>
                </select>

                <div id="adminCodeBox" style="display:none;">

                    <label for="adminCode">
                        Admin Secret Code
                    </label>

                    <input
                        type="password"
                        id="adminCode"
                        placeholder="Enter admin secret code"
                    >

                    <small>
                        Authorized admin access only.
                    </small>

                </div>

                <button
                    type="submit"
                    class="auth-btn"
                    id="registerBtn"
                >
                    Create Account
                </button>

            </form>

            <p class="auth-bottom">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- Firebase Registration -->

    <script type="module">

        import { auth, db } from "./firebase.js";

        import {
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {
            ref,
            set
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


        const role = document.getElementById("role");

        const adminCodeBox =
            document.getElementById("adminCodeBox");

        const adminCode =
            document.getElementById("adminCode");

        const registerForm =
            document.getElementById("registerForm");

        const registerBtn =
            document.getElementById("registerBtn");


        /*
         * Show / Hide Admin Code
         */

        role.addEventListener("change", function () {

            if (role.value === "admin") {

                adminCodeBox.style.display = "block";

                adminCode.required = true;

            } else {

                adminCodeBox.style.display = "none";

                adminCode.required = false;

                adminCode.value = "";

            }

        });


        /*
         * Registration
         */

        registerForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const mobile =
                document.getElementById("mobile").value.trim();

            const password =
                document.getElementById("password").value;

            const selectedRole =
                role.value;


            /*
             * Admin Secret Code
             */

            if (selectedRole === "admin") {

                if (adminCode.value !== "VSICS2026") {

                    alert("Invalid admin secret code.");

                    adminCode.focus();

                    return;
                }

            }


            /*
             * Button loading
             */

            registerBtn.disabled = true;

            registerBtn.textContent = "Creating Account...";


            try {

                /*
                 * Create Firebase Authentication account
                 */

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                /*
                 * Save user information
                 * in Realtime Database
                 */

                await set(
                    ref(db, "users/" + user.uid),
                    {
                        name: name,
                        email: email,
                        mobile: mobile,
                        role: selectedRole,
                        createdAt: Date.now()
                    }
                );


                /*
                 * Registration successful
                 */

                alert(
                    "Account created successfully!"
                );


                /*
                 * createUserWithEmailAndPassword
                 * automatically signs the user in.
                 */

                if (selectedRole === "admin") {

                    window.location.href =
                        "admin.html";

                } else {

                    window.location.href =
                        "citizen.html";

                }


            } catch (error) {

                console.error(error);

                let message =
                    "Registration failed. Please try again.";


                if (error.code === "auth/email-already-in-use") {

                    message =
                        "This email is already registered.";

                } else if (error.code === "auth/invalid-email") {

                    message =
                        "Please enter a valid email address.";

                } else if (error.code === "auth/weak-password") {

                    message =
                        "Password must be at least 6 characters.";

                } else if (error.code === "auth/network-request-failed") {

                    message =
                        "Network problem. Please check your internet.";

                } else if (error.code === "PERMISSION_DENIED") {

                    message =
                        "Database permission denied. Check Firebase Rules.";

                }


                alert(message);


                registerBtn.disabled = false;

                registerBtn.textContent =
                    "Create Account";

            }

        });

    </script>

</body>

</html>
